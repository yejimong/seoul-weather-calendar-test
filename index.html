<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>날씨 캘린더</title>
<style>

:root{color-scheme:light;--canvas:#fffaf0;--paper:#fffdf7;--cream:#f5edd9;--ink:#171a1b;--muted:#655d50;--line:#e4d9c3;--teal:#1a3a3a;--lavender:#ded1fa;--peach:#ffcaab;--ochre:#e8b94a;--red:#b32e31;--focus:#993742}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.55 Inter,"Malgun Gothic",system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:32px 24px 24px}h1,h2,p{margin:0}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hero{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;border-bottom:1px solid var(--line);padding-bottom:24px;gap:24px}.hero-copy{align-self:center;padding:18px 0}.place{font-size:.875rem;color:var(--muted);display:flex;align-items:center;gap:10px;margin-bottom:14px}.place::before{content:"";width:9px;height:9px;background:var(--red);box-shadow:3px 3px 0 var(--ochre)}h1{font-size:clamp(2.5rem,6.2vw,4.5rem);font-weight:500;line-height:1.06;letter-spacing:-.075em;margin-bottom:14px}.hero-copy>p:last-child{color:var(--muted)}
.coverage{margin:14px 0;color:var(--muted);font-size:.875rem}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}section,aside{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px}h2{font-size:1.35rem;font-weight:650;letter-spacing:-.045em}.month-nav{display:flex;align-items:center;gap:12px}.month-nav button{width:44px;height:44px;font-size:1.65rem;line-height:1}.month-nav button,.week-pick,.day{border:1px solid var(--line);border-radius:12px;background:var(--cream)}.month-nav button:disabled{opacity:.45;cursor:default}
.calendar-with-weeks,.calendar,#weeks{display:grid;gap:5px}.calendar-with-weeks{grid-template-columns:auto minmax(0,1fr);margin-top:14px}.calendar,#weeks{grid-template-rows:24px;grid-auto-rows:minmax(62px,1fr)}.calendar{grid-template-columns:repeat(7,minmax(0,1fr))}#weeks{grid-template-columns:1fr}.weekday{text-align:center;font-size:.875rem;color:var(--muted)}.week-pick{background:#f1e5ff;color:#46316a;white-space:nowrap;font-size:.875rem;padding:0 8px;min-width:44px}.day{min-width:0;text-align:left;padding:6px;background:#fcf3dd;font-variant-numeric:tabular-nums}.day-top{display:flex;justify-content:space-between;align-items:center;gap:2px}.day>span{display:block;font-size:.875rem}.day .day-icon{font-size:.85rem}.day.missing{background:#fffaf0;color:var(--muted)}.day[aria-pressed=true],.week-pick[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:white}
.compare-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.record{border-radius:16px;background:var(--peach);padding:14px 12px}.record.prior{background:var(--lavender)}.record strong,.record-date{display:block}.record-date,.rain-line,.week-period{font-size:.875rem;color:#514637}.record-date{overflow-wrap:anywhere}.weather-line{margin-top:9px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}.weather-icon{font-size:1.25rem}.rain-line,.week-period{margin-top:4px}.temperatures{margin:12px 0 0}.temperature{display:flex;justify-content:space-between;align-items:baseline;gap:4px;flex-wrap:wrap;margin-top:5px;font-size:.875rem}.temperature.mean{display:block;margin-bottom:8px}.temperature dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}.temperature.mean dd{font-size:clamp(1.5rem,3vw,2.3rem);line-height:1.1;letter-spacing:-.055em;white-space:nowrap}.temperature.high{color:#8d251c}.temperature.low{color:#194d79}.delta{margin-top:12px;background:var(--teal);color:white;border-radius:16px;padding:14px}.delta strong,.delta span{display:block}.delta strong{font-size:1.3rem}.delta span{color:#e1f0e8;font-size:.875rem}
footer{margin-top:18px;padding:14px 16px;border-radius:16px;background:#faf5e8;color:var(--muted);font-size:.875rem}footer a{color:var(--teal)}
@media(max-width:880px){.layout{grid-template-columns:1fr}.compare-cards .record{padding:14px 16px}}
@media(max-width:600px){main{padding:18px 12px}.hero{grid-template-columns:1fr;gap:8px;padding-bottom:16px}.hero-copy{padding:4px 0}section,aside{padding:12px}.calendar-with-weeks,.calendar,#weeks{gap:3px}.day{padding:3px}.week-pick{min-width:33px;padding:0 3px}.day .day-icon{font-size:.7rem}.day-top{flex-wrap:wrap;gap:0}.day>span{font-size:.75rem}}

:root{--canvas:#fff5cb;--paper:#fffdf3;--cream:#fff0b4;--ink:#231b19;--muted:#635044;--line:#33221d;--red:#bd201f;--focus:#bd201f}
body{font-family:NeoDunggeunmo,"Courier New",monospace;background-color:var(--canvas);background-image:radial-gradient(#dcac593d 1px,transparent 1px);background-size:10px 10px}main{max-width:1130px;padding-top:28px}
h1,h2,button,.temperature dd,.delta strong,.record strong{font-weight:400}
.hero{display:block;position:relative;text-align:center;background:#fff0b7;border:2px solid var(--line);border-top:13px solid var(--red);border-radius:0;box-shadow:5px 5px 0 #a65d352e;padding:20px 18px 22px}
.hero::after{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(90deg,var(--red) 0 5px,transparent 5px 10px);pointer-events:none}
.hero-copy{padding:0}.place{justify-content:center;margin-bottom:9px;font-size:.94rem}.place::before{width:6px;height:6px;box-shadow:2px 2px 0 #dfa731}.hero h1{letter-spacing:-.05em;font-size:clamp(2.5rem,6.5vw,4.25rem);margin-bottom:9px;line-height:1.05}.hero-copy>p:last-child{font-size:1rem}
.coverage{margin:15px 0 11px}.layout{gap:14px}section,aside{border:2px solid var(--line);border-radius:0;box-shadow:4px 4px 0 #a65d352e;padding:18px}h2{font-size:1.48rem;letter-spacing:-.045em}
.month-nav{gap:9px}.month-nav button,.week-pick,.day{border-radius:0}.month-nav button{border-color:var(--line);width:40px;height:40px;background:#fff3c5;line-height:1}.month-nav button:disabled{opacity:.4}.week-pick{border-color:#ac7854;background:#ffe5a3;color:#592923}.weekday{font-size:.95rem}.day{background:#fff4d0;border-color:#e3c783}.day.missing{background:#fffaf0;border-color:#e3d8bd}.day[aria-pressed=true],.week-pick[aria-pressed=true]{background:var(--red);border-color:#861614;color:#fff}
.record,.record.prior{border-radius:0;border:1px solid #c68e52;background:#ffe7ac}.record.prior{background:#fff2ce}.record strong{font-size:1.18rem}.record-date,.rain-line,.week-period{color:var(--muted)}.temperature.high{color:#9a221c}.temperature.low{color:#204a75}.temperature.mean dd{letter-spacing:-.045em}.delta{background:#5e161c;border-radius:0;border:1px solid #4b1318;padding:12px 14px}.delta span{color:#ffedcf}.delta strong{font-size:1.45rem}
footer{border-radius:0;background:#fff0b4;border:1px dashed #9b7146;color:#514330}footer a{color:#821b1c}.font-license{margin-top:5px}.font-license summary{cursor:pointer;width:max-content}.font-license pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 system-ui,sans-serif}
@media(max-width:600px){main{padding:14px 10px}.hero{padding:15px 8px}.hero-copy{padding:0}section,aside{padding:10px}.month-nav button{width:36px;height:36px}.day>span{font-size:.75rem}}

.layout{margin-top:16px}

.mascot-dialogue{display:grid;grid-template-columns:82px minmax(0,1fr);align-items:center;gap:18px;margin-top:17px;min-height:91px}
.dialogue-character{position:relative;display:block;width:82px;height:86px;overflow:hidden}
.dialogue-character img{position:absolute;width:171px;height:auto;max-width:none;left:-50px;top:-43px;image-rendering:pixelated;clip-path:polygon(41% 37%,45% 34%,57% 34%,60% 38%,67% 44%,70% 49%,75% 52%,75% 76%,70% 98%,34% 98%,30% 75%,30% 53%,35% 48%,38% 41%)}
.dialogue-bubble{position:relative;display:flex;align-items:center;min-height:76px;padding:14px 18px;background:#fffdf7;border:2px solid var(--line);box-shadow:4px 4px 0 #a65d352e;font-size:clamp(1rem,2.4vw,1.35rem)}
.dialogue-bubble::before{content:"";position:absolute;left:-9px;top:calc(50% - 7px);width:12px;height:12px;background:inherit;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
@media(max-width:600px){.mascot-dialogue{grid-template-columns:62px minmax(0,1fr);gap:11px}.dialogue-character{transform:scale(.78);transform-origin:left center}.dialogue-bubble{padding:10px 12px;min-height:67px}}

.dialogue-character img{position:static;display:block;width:100%;height:100%;object-fit:contain;clip-path:none}
.dialogue-bubble{gap:10px}
.dialogue-bubble::before{content:none}
.dialogue-arrow{display:inline-block;flex:none;width:0;height:0;border-block:6px solid transparent}
.dialogue-arrow.start{border-left:8px solid #171313}
.dialogue-arrow.end{border-right:8px solid #171313}

.weather-update{display:flex;justify-content:flex-end;margin-top:10px}
.weather-update button{padding:6px 14px;min-height:40px;background:#fff9df;color:#62161b;border:2px solid #62161b;box-shadow:2px 2px 0 #a65d352e}
.weather-update button:disabled{opacity:.55;cursor:wait}
.update-status:not(:empty){margin-top:8px;font-size:.875rem;color:var(--muted);text-align:right}

.day.is-today{outline:2px solid #831a1d;outline-offset:-2px;box-shadow:inset 0 0 0 4px #ffe7ac}
.day.is-today:focus-visible{outline:3px solid #571219;outline-offset:1px}
.day .observation-time{font-size:.75rem;line-height:1.1}
.day .observation-time:empty{display:none}

</style>

const seoulDate = () => new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul"}).format(new Date());
const openingDate=seoulDate();
const inCalendar=/^2026-(0[1-9]|1[01])-/.test(openingDate);
let month=inCalendar?Number(openingDate.slice(5,7)):11;
let selected=inCalendar?Number(openingDate.slice(8,10)):1;
let week = null;
const calendar = document.querySelector("#calendar");
const dateFor = (year,day) => [year,month,day].map(value=>String(value).padStart(2,"0")).join("-");
let dataThrough = "2026-11-24";
function number(value) {
  if (typeof value !== "string" && typeof value !== "number") return null;
  return String(value).trim() && Number.isFinite(Number(value)) ? Number(value) : null;
}
function metric(value,unit) {
  const amount = number(value);
  return amount === null ? "—" : amount + unit;
}
function weather(row) {
  const phenomena = typeof row.iscs === "string" ? row.iscs : "";
  const rain = /\{(?:비|소나기|이슬비|진눈깨비)\}/.test(phenomena);
  const snow = /\{(?:눈|소낙눈|싸락눈|가루눈|진눈깨비)\}/.test(phenomena);
  if (rain && snow) return "비·눈";
  if (snow) return "눈";
  if (rain) return "비";
  if (number(row.sumRn) > 0) return "강수";
  const clouds = number(row.avgTca);
  return clouds === null ? "날씨 자료 없음" : clouds <= 2 ? "맑음" : clouds >= 8 ? "흐림" : "구름";
}
const previous = document.querySelector("#prevMonth");
const next = document.querySelector("#nextMonth");
const daysInMonth = () => new Date(Date.UTC(2026,month,0)).getUTCDate();
const weekList = document.querySelector("#weeks");
const emojis = {"맑음":"☀️","구름":"⛅","흐림":"☁️","비":"🌧️","눈":"❄️","비·눈":"🌨️","강수":"🌧️"};
const mondayOffset = () => (new Date(Date.UTC(2026,month-1,1)).getUTCDay()+6)%7;
const weekCount = () => Math.ceil((mondayOffset()+daysInMonth())/7);
function icon(condition) {
  return emojis[condition] || "";
}
function weekDates(index) {
  return Array.from({length:7},(_,day) =>
    new Date(Date.UTC(2026,month-1,1-mondayOffset()+7*index+day)).toISOString().slice(0,10)
  );
}
function lastYear(date) {
  return (Number(date.slice(0,4))-1)+date.slice(4);
}
function showMonth() {
  calendar.replaceChildren();
  weekList.replaceChildren();
  weekList.append(document.createElement("span"));
  for (let index=0; index<weekCount(); index++) {
    const button=document.createElement("button");
    button.type="button";
    button.className="week-pick";
    button.textContent=(index+1)+"주";
    button.setAttribute("aria-label",(index+1)+"주차 평균기온 비교");
    button.addEventListener("click",()=>{week=index; render();});
    weekList.append(button);
  }
  document.querySelector("#month").textContent = "2026년 "+month+"월";
  previous.disabled = month === 1;
  next.disabled = month === 11;
  for (const weekday of ["월","화","수","목","금","토","일"]) {
    const label = document.createElement("span");
    label.className = "weekday";
    label.textContent = weekday;
    calendar.append(label);
  }
  const firstWeekday = mondayOffset();
  for (let i = 0; i < firstWeekday; i++) {
    const spacer = document.createElement("span");
    spacer.setAttribute("aria-hidden","true");
    calendar.append(spacer);
  }
  for (let day = 1; day <= daysInMonth(); day++) {
    const button = document.createElement("button");
    button.className = "day";
    button.type = "button";
    const top=document.createElement("div");
    top.className="day-top";
    const weatherIcon=document.createElement("span");
    weatherIcon.className="day-icon";
    weatherIcon.setAttribute("aria-hidden","true");
    top.append(String(day),weatherIcon);
    const observationTime=document.createElement("span");
    observationTime.className="observation-time";
    button.append(top,document.createElement("span"),observationTime);
    button.addEventListener("click",() => {selected=day; week=null; render();});
    calendar.append(button);
  }
  render();
}
function moveMonth(direction) {
  const target = month + direction;
  if (target < 1 || target > 11) return;
  month = target;
  week = null;
  selected = Math.min(selected, daysInMonth());
  showMonth();
}
previous.addEventListener("click", () => moveMonth(-1));
next.addEventListener("click", () => moveMonth(1));
function record(year,label) {
  const date = dateFor(year,selected);
  const row = data.get(date);
  const heading = '<strong>'+label+'</strong><span class="record-date">'+date+'</span>';
  const card = '<div class="record'+(year===2025?' prior':'')+'">';
  const live=year===2026 ? observationFor(date) : null;
  if (live) {
    return card+heading+'<p class="weather-line">'+(live.condition?icon(live.condition)+' '+live.condition+' · ':'')+live.time+' 관측</p><dl class="temperatures"><div class="temperature mean"><dt>현재 관측기온</dt><dd>'+metric(live.temp,"°C")+'</dd></div></dl></div>';
  }
  if (!row) return card+heading+'<p class="weather-line">'+(date>dataThrough?"과거 관측자료 제공 전":"관측자료 없음")+'</p></div>';
  const condition=weather(row);
  return card+heading+'<p class="weather-line"><span class="weather-icon" aria-hidden="true">'+icon(condition)+'</span>'+condition+'</p><p class="rain-line">일강수량 '+metric(row.sumRn," mm")+'</p><dl class="temperatures">'+
    [["평균",row.avgTa,"mean"],["최고",row.maxTa,"high"],["최저",row.minTa,"low"]].map(([name,value,style])=>'<div class="temperature '+style+'"><dt>'+name+'</dt><dd>'+metric(value,"°C")+'</dd></div>').join("")+'</dl></div>';
}
function mean(values) {
  return values.length ? values.reduce((sum,value)=>sum+value,0)/values.length : null;
}
function deltaBlock(change,note="") {
  const rounded=change===null ? null : Math.round(Math.abs(change)*10)/10;
  const summary=rounded===null ? "비교할 관측자료 없음" : rounded===0 ? "전년과 같음" : rounded.toFixed(1)+"°C "+(change>0?"높음":"낮음");
  return '<div class="delta"><span>전년 대비 평균기온</span><strong>'+summary+'</strong>'+(note?'<span>'+note+'</span>':'')+'</div>';
}
function weekComparison() {
  const currentDates=weekDates(week);
  const priorDates=currentDates.map(lastYear);
  const values=dates=>dates.map(date=>number(data.get(date)?.avgTa));
  const current=values(currentDates), prior=values(priorDates);
  const matched=current.flatMap((value,index)=>value!==null && prior[index]!==null?[value-prior[index]]:[]);
  const period=dates=>dates[0]+" ~ "+dates[6];
  const card=(label,dates,temps,style)=>{
    const available=temps.filter(value=>value!==null);
    const average=mean(available);
    return '<div class="record '+style+'"><strong>'+label+'</strong><span class="record-date">'+period(dates)+'</span><dl class="temperatures"><div class="temperature mean"><dt>평균기온</dt><dd>'+(average===null?"—":average.toFixed(1)+"°C")+'</dd></div></dl><p class="rain-line">관측 '+available.length+'/7일</p></div>';
  };
  const note=matched.length<7 ? "같은 날짜에 두 해 모두 관측된 "+matched.length+"일 기준" : "";
  return '<p class="week-period">월요일부터 일요일까지 · 전년은 같은 달과 일 기준</p><div class="compare-cards">'+
    card("당해",currentDates,current,"")+card("전년",priorDates,prior,"prior")+'</div>'+deltaBlock(mean(matched),note);
}

function averageChange(current,prior) {
  return current===null || prior===null ? null : Math.round((current-prior)*10)/10;
}
function selectedObservations() {
  const today=dateFor(2026,selected);
  const yesterday=new Date(Date.UTC(2026,month-1,selected-1)).toISOString().slice(0,10);
  return [data.get(today),data.get(yesterday)];
}
function rainy(row) {
  if (!row) return false;
  return ["비","비·눈","강수"].includes(weather(row));
}
function mascotVariant(today,yesterday) {
  if (week!==null || !today) return "default";
  if (rainy(today)) return "rain";
  const change=averageChange(number(today.avgTa),number(yesterday?.avgTa));
  const low=number(today.minTa);
  if ((change!==null && change<=-5) || (low!==null && low<-5)) return "cold";
  if (rainy(yesterday) && !(number(today.sumRn)>0) && weather(today)!=="눈") return "dry";
  if (change!==null && change>=5) return "warm";
  return "default";
}
function mascotMessage(today,yesterday) {
  if (week!==null) return "날짜를 콕 눌러봐! 어제랑 얼마나 달라졌는지 알려줄게.";
  const current=number(today?.avgTa);
  const prior=number(yesterday?.avgTa);
  if (current===null) return "이날은 아직 관측자료가 없어. 다른 날짜를 눌러봐!";
  if (prior===null) return "어제의 관측자료가 없어서 비교하기 어렵네!";
  const change=averageChange(current,prior);
  if (change===0) return "어제랑 평균기온이 똑같네! 신기하다 ㅎㅎ";
  const reactions=change>0?warmerReactions:colderReactions;
  const reaction=reactions[(month*31+selected)%reactions.length];
  return "어제보다 "+Math.abs(change).toFixed(1)+"도 "+(change>0?"올랐다":"떨어졌네")+" "+reaction;
}
function render() {
  const [today,yesterday]=selectedObservations();
  const mascot=document.querySelector("#dialogueMascot");
  const source=mascotImages[mascotVariant(today,yesterday)];
  if (mascot.getAttribute("src")!==source) mascot.setAttribute("src",source);
  document.querySelector("#mascotSpeech").textContent=mascotMessage(today,yesterday);
  Array.from(calendar.querySelectorAll("button")).forEach((button,index)=>{
    const day=index+1;
    const date=dateFor(2026,day);
    const row=data.get(date);
    const live=observationFor(date);
    const active=week===null && day===selected;
    const today=date===seoulDate();
    button.setAttribute("aria-pressed",String(active));
    button.setAttribute("aria-current",today?"date":"false");
    button.classList.toggle("is-today",today && active);
    button.classList.toggle("missing",!row && !live);
    const condition=live ? live.condition : row ? weather(row) : "";
    button.firstChild.lastChild.textContent=icon(condition);
    button.children[1].textContent=live ? metric(live.temp,"°C") : row ? metric(row.avgTa,"°C") : "—";
    button.lastChild.textContent=live ? live.time : "";
    button.title=live ? "최신 관측기온 · "+live.time : "";
  });
  Array.from(weekList.querySelectorAll("button")).forEach((button,index)=>button.setAttribute("aria-pressed",String(week===index)));
  document.querySelector("#selection").textContent=month+"월 "+(week===null?selected+"일":(week+1)+"주차")+" 비교";
  const comparison=document.querySelector("#comparison");
  if (week!==null) {
    comparison.innerHTML=weekComparison();
    return;
  }
  const current=number(data.get(dateFor(2026,selected))?.avgTa);
  const prior=number(data.get(dateFor(2025,selected))?.avgTa);
  const change=current===null || prior===null ? null : current-prior;
  const compare=observationFor(dateFor(2026,selected)) ? deltaBlock(null,"오늘 일평균기온은 다음 날 비교할 수 있어요.") : deltaBlock(change);
  comparison.innerHTML='<div class="compare-cards">'+record(2026,"당해")+record(2025,"전년")+'</div>'+compare;
}
const updateButton=document.querySelector("#updateWeather");
const updateStatus=document.querySelector("#updateStatus");
let latestObservation={"date":"2026-11-25","time":"15:00","condition":"","temp":7.3};
function observationFor(date) {
  return date===seoulDate() && latestObservation?.date===date ? latestObservation : null;
}

    if(result.current) latestObservation=result.current;
    render();
    const messages=[...(result.daily?["일자료 업데이트 완료"]:[]),...(result.current?["초단기실황 업데이트 완료"]:[]),...result.errors];
    updateStatus.textContent=interactive || result.errors.length ? messages.join(" · ") : "";
  } catch {
    updateStatus.textContent="연결이 끊겼어요. 실행 창이 열려 있는지 확인하고 다시 시도해 주세요.";
  } finally {updateButton.disabled=false;}
} 
updateButton.addEventListener("click",()=>refreshWeather(true));
showMonth();
if (location.protocol!=="file:") refreshWeather(false);
</script></html>
